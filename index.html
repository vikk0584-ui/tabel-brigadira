<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005fcc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Табель бригадира</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --blue: #005fcc;
      --blue-dark: #004a99;
      --gray: #6b7280;
      --gray-bg: #f5f7fa;
      --border: #e2e6ec;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--gray-bg);
      color: #1a1a1a;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }

    body {
      padding: 12px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      max-width: 100vw;
      overflow-x: hidden;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }
    h3 {
      margin: 16px 0 10px;
      font-size: 16px;
      color: var(--gray);
    }

    /* ====== Табы ====== */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
      background: #e8ecf1;
      padding: 4px;
      border-radius: 10px;
    }
    .tab-btn {
      padding: 12px 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--gray);
      min-height: 44px;
      transition: background .15s, color .15s;
    }
    .tab-btn.active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* ====== Ввод ====== */
    input[type="text"], input[type="time"] {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px; /* 16px → iOS не зумит при фокусе */
      width: 100%;
      background: #fff;
      font-family: inherit;
      color: inherit;
    }
    input[type="time"] {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      min-height: 44px;
      padding: 10px 14px;
      transition: background .15s, transform .05s;
    }
    button:active { transform: scale(.97); }

    .btn-primary {
      background: var(--blue);
      color: #fff;
      width: 100%;
    }
    .btn-primary:hover { background: var(--blue-dark); }

    .btn-danger {
      background: #fdecec;
      color: #c0392b;
      padding: 8px 12px;
      min-height: 38px;
      font-size: 13px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    @media (min-width: 480px) {
      .input-row { grid-template-columns: 1fr 1fr; }
    }

    /* ====== Список сотрудников ====== */
    .emp-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .emp-item .info { flex: 1; min-width: 0; }
    .emp-item .name {
      font-weight: 600;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .emp-item .role {
      font-size: 13px;
      color: var(--gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ====== Дата ====== */
    .date-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      background: #fff;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .btn-nav {
      background: var(--gray-bg);
      color: #333;
      width: 44px;
      min-height: 44px;
      padding: 0;
      font-size: 18px;
      flex-shrink: 0;
    }
    #displayDate {
      flex: 1;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
    }

    /* ====== Сводка ====== */
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .summary-card {
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .summary-card .label {
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 4px;
    }
    .summary-card .value {
      font-size: 18px;
      font-weight: 700;
      color: var(--blue);
    }

    /* ====== Карточка сотрудника в табеле ====== */
    .emp-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-head .who {
      min-width: 0;
      flex: 1;
    }
    .card-head .name {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-head .role {
      font-size: 12px;
      color: var(--gray);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-head .right {
      text-align: right;
      flex-shrink: 0;
    }
    .hours {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #111;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      margin-top: 3px;
      white-space: nowrap;
    }
    .bg-gray { background: #9ca3af; }
    .bg-yellow { background: #f39c12; }
    .bg-orange { background: #e67e22; }
    .bg-green { background: #2ecc71; }

    /* ====== Сетка кнопок в карточке ====== */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .act-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 10px 4px;
      min-height: 60px;
      border-radius: 10px;
      background: var(--gray-bg);
      color: #333;
      border: 1.5px solid transparent;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.1;
      transition: all .15s;
    }
    .act-btn .icon {
      font-size: 18px;
      line-height: 1;
    }
    .act-btn .t {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #111;
    }
    .act-btn.filled {
      background: #e6f0fb;
      border-color: #b8d4f0;
    }
    .act-btn.done {
      background: #e8f8ef;
      border-color: #b3e6c9;
    }
    .act-btn:active { transform: scale(.96); }

    /* ====== Строка «точная настройка» ====== */
    .fine-tune {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 11px;
      color: var(--gray);
    }
    .fine-tune label {
      display: block;
      margin-bottom: 3px;
      text-align: center;
    }
    .fine-tune input[type="time"] {
      padding: 6px 4px;
      font-size: 13px;
      min-height: 38px;
    }

    /* ====== Экспорт ====== */
    .export-btn {
      background: var(--blue);
      color: #fff;
      width: 100%;
      margin-top: 14px;
      min-height: 50px;
      font-size: 16px;
    }

    /* ====== Пустой список ====== */
    .empty {
      text-align: center;
      padding: 24px 12px;
      color: var(--gray);
      font-size: 14px;
      background: #fff;
      border-radius: 12px;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>
  <h2>Табель бригадира</h2>

  <div class="tabs">
    <button class="tab-btn active" data-tab="employees" onclick="switchTab('employees')">👥 Сотрудники</button>
    <button class="tab-btn" data-tab="tabel" onclick="switchTab('tabel')">📋 Табель</button>
  </div>

  <!-- ========== СОТРУДНИКИ ========== -->
  <div id="panel-employees" class="panel active">
    <h3>Добавить сотрудника</h3>
    <div class="input-row">
      <input id="empName" type="text" placeholder="ФИО" autocomplete="off">
      <input id="empRole" type="text" placeholder="Должность" autocomplete="off">
    </div>
    <button class="btn-primary" onclick="addEmployee()">➕ Добавить</button>

    <h3>Список (<span id="empCount">0</span>)</h3>
    <div id="employeesList"></div>
  </div>

  <!-- ========== ТАБЕЛЬ ========== -->
  <div id="panel-tabel" class="panel">
    <div class="date-controls">
      <button class="btn-nav" onclick="changeDate(-1)">←</button>
      <span id="displayDate"></span>
      <button class="btn-nav" onclick="changeDate(+1)">→</button>
    </div>

    <div class="summary">
      <div class="summary-card">
        <div class="label">Итого за день</div>
        <div class="value" id="totalHours">0ч 00м</div>
      </div>
      <div class="summary-card">
        <div class="label">Отмечены</div>
        <div class="value" id="markedCount">0 / 0</div>
      </div>
    </div>

    <div id="tabelBody"></div>

    <button class="export-btn" onclick="exportCSV()">📥 Экспорт в CSV</button>
  </div>

  <script>
    // ==================== STATE ====================
    let employees = JSON.parse(localStorage.getItem('tabel_employees')) || [];
    let tabelData = JSON.parse(localStorage.getItem('tabel_data')) || {};
    let currentDate = todayISO();

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function isoToLocalDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function saveData() {
      localStorage.setItem('tabel_employees', JSON.stringify(employees));
      localStorage.setItem('tabel_data', JSON.stringify(tabelData));
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    // ==================== СОТРУДНИКИ ====================
    function renderEmployees() {
      const list = document.getElementById('employeesList');
      document.getElementById('empCount').textContent = employees.length;
      if (!employees.length) {
        list.innerHTML = '<div class="empty">Пока никого нет.<br>Добавьте первого сотрудника.</div>';
        return;
      }
      list.innerHTML = employees.map(e => `
        <div class="emp-item">
          <div class="info">
            <div class="name">${escapeHtml(e.name)}</div>
            <div class="role">${escapeHtml(e.role) || '—'}</div>
          </div>
          <button class="btn-danger" onclick="removeEmployee(${e.id})">Удалить</button>
        </div>
      `).join('');
    }

    function addEmployee() {
      const nameEl = document.getElementById('empName');
      const roleEl = document.getElementById('empRole');
      const name = nameEl.value.trim();
      const role = roleEl.value.trim();
      if (!name) { nameEl.focus(); return alert('Введите ФИО'); }
      employees.push({ id: Date.now(), name, role });
      nameEl.value = '';
      roleEl.value = '';
      nameEl.focus();
      renderEmployees();
      saveData();
      renderTabel();
    }

    function removeEmployee(id) {
      const emp = employees.find(e => e.id === id);
      if (!emp) return;
      if (!confirm(`Удалить "${emp.name}"?`)) return;
      employees = employees.filter(e => e.id !== id);
      // Заодно чистим его данные из табеля (все даты)
      Object.keys(tabelData).forEach(date => {
        if (tabelData[date][id]) delete tabelData[date][id];
      });
      renderEmployees();
      saveData();
      renderTabel();
    }

    // ==================== ТАБЫ ====================
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === tab)
      );
      document.querySelectorAll('.panel').forEach(p =>
        p.classList.toggle('active', p.id === 'panel-' + tab)
      );
    }

    // ==================== ДАТА ====================
    function setDate(iso) {
      currentDate = iso;
      const d = isoToLocalDate(iso);
      document.getElementById('displayDate').textContent =
        d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', weekday: 'short' });
      renderTabel();
    }
    function changeDate(delta) {
      const d = isoToLocalDate(currentDate);
      d.setDate(d.getDate() + delta);
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      setDate(iso);
    }

    // ==================== РАСЧЁТЫ ====================
    function timeToMinutes(t) {
      if (!t) return 0;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }
    function minutesToHMS(m) {
      m = Math.max(0, m | 0);
      const h = Math.floor(m / 60);
      const min = m % 60;
      return `${h}ч ${String(min).padStart(2,'0')}м`;
    }
    function calcMinutes(inT, outT, liT, loT) {
      if (!inT || !outT) return 0;
      const inM = timeToMinutes(inT);
      let outM = timeToMinutes(outT);
      if (outM < inM) outM += 24 * 60;
      const liM = timeToMinutes(liT);
      const loM = timeToMinutes(loT);
      if (liM && loM && loM > liM && liM >= inM && loM <= outM) {
        return Math.max(0, (outM - inM) - (loM - liM));
      }
      return Math.max(0, outM - inM);
    }
    function getStatus(s) {
      if (!s.in) return { txt: 'не отмечен', cls: 'bg-gray' };
      if (!s.out) {
        if (s.lunchIn && !s.lunchOut) return { txt: 'на обеде', cls: 'bg-orange' };
        return { txt: 'на смене', cls: 'bg-yellow' };
      }
      return { txt: 'отработано', cls: 'bg-green' };
    }

    // ==================== РЕНДЕР ТАБЕЛЯ ====================
    function renderTabel() {
      const wrap = document.getElementById('tabelBody');

      if (!employees.length) {
        wrap.innerHTML = '<div class="empty">Добавьте сотрудников на вкладке «Сотрудники»</div>';
        updateSummary();
        return;
      }

      const dayData = tabelData[currentDate] || {};

      wrap.innerHTML = employees.map(emp => {
        const s = dayData[emp.id] || {};
        const mins = calcMinutes(s.in, s.out, s.lunchIn, s.lunchOut);
        const status = getStatus(s);

        return `
          <div class="emp-card" data-id="${emp.id}">
            <div class="card-head">
              <div class="who">
                <div class="name">${escapeHtml(emp.name)}</div>
                <div class="role">${escapeHtml(emp.role) || '—'}</div>
              </div>
              <div class="right">
                <div class="hours">${minutesToHMS(mins)}</div>
                <span class="badge ${status.cls}">${status.txt}</span>
              </div>
            </div>

            <div class="actions">
              <button class="act-btn ${s.in ? 'filled' : ''}" data-now="in" data-id="${emp.id}">
                <span class="icon">🟢</span>
                <span>Приход</span>
                <span class="t">${s.in || '--:--'}</span>
              </button>
              <button class="act-btn ${s.lunchIn ? 'filled' : ''} ${s.lunchOut ? 'done' : ''}" data-now="lunch" data-id="${emp.id}">
                <span class="icon">🍽</span>
                <span>Обед</span>
                <span class="t">${s.lunchIn ? (s.lunchIn + (s.lunchOut ? '–' + s.lunchOut : '–…')) : '--:--'}</span>
              </button>
              <button class="act-btn ${s.out ? 'done' : ''}" data-now="out" data-id="${emp.id}">
                <span class="icon">🔴</span>
                <span>Уход</span>
                <span class="t">${s.out || '--:--'}</span>
              </button>
            </div>

            <div class="fine-tune">
              <div><label>Приход</label><input type="time" class="ft-in" data-id="${emp.id}" value="${s.in || ''}"></div>
              <div><label>Обед ↦</label><input type="time" class="ft-li" data-id="${emp.id}" value="${s.lunchIn || ''}"></div>
              <div><label>↤ Обед</label><input type="time" class="ft-lo" data-id="${emp.id}" value="${s.lunchOut || ''}"></div>
              <div><label>Уход</label><input type="time" class="ft-out" data-id="${emp.id}" value="${s.out || ''}"></div>
            </div>
          </div>
        `;
      }).join('');

      updateSummary();
    }

    function updateSummary() {
      const dayData = tabelData[currentDate] || {};
      let marked = 0, totalM = 0;
      employees.forEach(emp => {
        const s = dayData[emp.id] || {};
        if (s.in) marked++;
        totalM += calcMinutes(s.in, s.out, s.lunchIn, s.lunchOut);
      });
      document.getElementById('totalHours').textContent = minutesToHMS(totalM);
      document.getElementById('markedCount').textContent = `${marked} / ${employees.length}`;
    }

    // ==================== ОБНОВЛЕНИЕ ОДНОЙ КАРТОЧКИ ====================
    function refreshCard(id) {
      const card = document.querySelector(`.emp-card[data-id="${id}"]`);
      if (!card) return;
      const s = tabelData[currentDate]?.[id] || {};

      // Часы + статус
      const mins = calcMinutes(s.in, s.out, s.lunchIn, s.lunchOut);
      card.querySelector('.hours').textContent = minutesToHMS(mins);
      const status = getStatus(s);
      const badge = card.querySelector('.badge');
      badge.className = 'badge ' + status.cls;
      badge.textContent = status.txt;

      // Кнопки
      const btnIn = card.querySelector('[data-now="in"]');
      const btnLunch = card.querySelector('[data-now="lunch"]');
      const btnOut = card.querySelector('[data-now="out"]');

      btnIn.classList.toggle('filled', !!s.in);
      btnIn.querySelector('.t').textContent = s.in || '--:--';

      btnLunch.classList.toggle('filled', !!s.lunchIn);
      btnLunch.classList.toggle('done', !!s.lunchOut);
      btnLunch.querySelector('.t').textContent = s.lunchIn
        ? (s.lunchIn + (s.lunchOut ? '–' + s.lunchOut : '–…'))
        : '--:--';

      btnOut.classList.toggle('done', !!s.out);
      btnOut.querySelector('.t').textContent = s.out || '--:--';

      // Скрытые input'ы
      card.querySelector('.ft-in').value = s.in || '';
      card.querySelector('.ft-li').value = s.lunchIn || '';
      card.querySelector('.ft-lo').value = s.lunchOut || '';
      card.querySelector('.ft-out').value = s.out || '';

      updateSummary();
    }

    function ensureRow(id) {
      tabelData[currentDate] = tabelData[currentDate] || {};
      tabelData[currentDate][id] = tabelData[currentDate][id] || {
        in: '', out: '', lunchIn: '', lunchOut: ''
      };
      return tabelData[currentDate][id];
    }

    function nowHHMM() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // ==================== ДЕЛЕГИРОВАНИЕ ====================
    document.getElementById('tabelBody').addEventListener('click', e => {
      const btn = e.target.closest('.act-btn');
      if (!btn) return;
      const id = btn.dataset.id;
      const kind = btn.dataset.now;
      const row = ensureRow(id);
      const t = nowHHMM();

      if (kind === 'in') {
        // Повторный тап — сбросить
        if (row.in) { row.in = ''; }
        else { row.in = t; }
      }
      else if (kind === 'out') {
        if (row.out) { row.out = ''; }
        else { row.out = t; }
      }
      else if (kind === 'lunch') {
        if (!row.lunchIn) row.lunchIn = t;            // старт обеда
        else if (!row.lunchOut) row.lunchOut = t;     // конец обеда
        else { row.lunchIn = ''; row.lunchOut = ''; } // сброс
      }

      saveData();
      refreshCard(id);
    });

    document.getElementById('tabelBody').addEventListener('change', e => {
      const input = e.target.closest('input[type="time"]');
      if (!input) return;
      const id = input.dataset.id;
      const row = ensureRow(id);

      if (input.classList.contains('ft-in')) row.in = input.value;
      else if (input.classList.contains('ft-li')) row.lunchIn = input.value;
      else if (input.classList.contains('ft-lo')) row.lunchOut = input.value;
      else if (input.classList.contains('ft-out')) row.out = input.value;

      saveData();
      refreshCard(id);
    });

    // ==================== CSV ====================
    function exportCSV() {
      let csv = 'Дата,ФИО,Должность,Приход,Уход,Обед_начало,Обед_конец,Отработано\n';
      const dayData = tabelData[currentDate] || {};
      const esc = v => `"${String(v || '').replace(/"/g, '""')}"`;
      employees.forEach(emp => {
        const s = dayData[emp.id] || {};
        const mins = calcMinutes(s.in, s.out, s.lunchIn, s.lunchOut);
        csv += [
          currentDate,
          esc(emp.name),
          esc(emp.role),
          esc(s.in),
          esc(s.out),
          esc(s.lunchIn),
          esc(s.lunchOut),
          esc(minutesToHMS(mins))
        ].join(',') + '\n';
      });
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tabel_${currentDate}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // ==================== INIT ====================
    renderEmployees();
    setDate(currentDate);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
